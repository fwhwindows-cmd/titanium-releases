name: Build Nuvio Engine AAR

on:
  push:
    branches:
      - torrent-poc
  workflow_dispatch:

jobs:
  build-nuvio-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Titanium test branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - name: Clone pinned Nuvio Engine
        run: |
          git clone https://github.com/NuvioMedia/nuvio-engine.git nuvio-engine
          cd nuvio-engine
          git checkout ddb383ba46bafb9970baf0bc23f51de786f58a4c

      - name: Make build scripts executable
        run: |
          chmod +x nuvio-engine/platform/android/gradlew
          chmod +x nuvio-engine/scripts/*.sh

      - name: Build release AAR
        working-directory: nuvio-engine/platform/android
        run: ./gradlew :engine:assembleRelease --stacktrace

      - name: Verify AAR
        working-directory: nuvio-engine
        run: ./scripts/verify-android-aar.sh platform/android/engine/build/outputs/aar/engine-release.aar

      - name: Upload Nuvio Engine AAR
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-engine-android-0.1.4
          path: nuvio-engine/platform/android/engine/build/outputs/aar/engine-release.aar
          if-no-files-found: error
          retention-days: 14
